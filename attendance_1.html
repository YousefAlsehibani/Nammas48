<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طوبي — تسجيل الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:   #1f3a2c;
    --green:        #274434;
    --green-soft:   #3d6b52;
    --orange:       #d87234;
    --orange-deep:  #b95a24;
    --stone:        #928a7e;
    --stone-light:  #bcb5ae;
    --cream:        #f8f6f1;
    --paper:        #fffdf8;
    --paper-line:   #ece5d6;
    --ink:          #26221c;
    --muted:        #8a8172;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(216,114,52,0.08), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(39,68,52,0.10), transparent 45%),
      var(--cream);
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 16px;
  }

  .card{
    background: var(--paper);
    width: 100%;
    max-width: 500px;
    border-radius: 18px;
    box-shadow: 0 30px 70px rgba(31,58,44,0.18), 0 1px 0 rgba(255,255,255,0.6) inset;
    overflow: hidden;
    position: relative;
  }

  /* ---------- header ---------- */
  .header{
    position: relative;
    padding: 30px 24px 0;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(180deg, #fbf8f2, var(--paper) 85%);
  }

  .peaks{
    position:absolute;
    left:0; right:0; top: 8px;
    width:100%;
    height: 92px;
    opacity: 0.55;
  }

  .logo{
    position: relative;
    width: 280px;
    height: auto;
    margin: 8px auto 20px;
    display:block;
  }

  /* sadu triangle band */
  .sadu{
    height: 16px;
    width: 100%;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='16'%3E%3Cpolygon points='0,16 8,0 16,16' fill='%23274434'/%3E%3Cpolygon points='16,16 24,0 32,16' fill='%23d87234'/%3E%3Cpolygon points='32,16 40,0 48,16' fill='%23928a7e'/%3E%3Cpolygon points='48,16 56,0 64,16' fill='%23274434'/%3E%3C/svg%3E");
    background-repeat: repeat-x;
    background-size: 64px 16px;
  }

  /* ---------- body ---------- */
  .body{
    padding: 30px 28px 28px;
  }

  .eyebrow{
    font-size: 12.5px;
    letter-spacing: 2.5px;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 4px;
  }

  h1{
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 24px;
    color: var(--green-deep);
    line-height: 1.4;
  }

  label{
    display:block;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .name-field{
    width:100%;
    font-family: 'Tajawal', sans-serif;
    font-size: 19px;
    font-weight: 500;
    border: none;
    border-bottom: 2.5px dashed var(--stone-light);
    background: transparent;
    padding: 6px 2px 12px;
    color: var(--ink);
    outline: none;
    transition: border-color .2s ease;
  }
  .name-field::placeholder{ color:#c3bbab; font-weight:400; }
  .name-field:focus{ border-bottom-color: var(--orange-deep); }

  .divider{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 28px 0 16px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--paper-line);
  }

  .options{
    display:flex;
    flex-direction: column;
    gap: 14px;
  }

  .option{
    border-radius: 12px;
    border: 2px solid transparent;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    overflow: hidden;
  }
  .option:active{ transform: scale(0.99); }

  /* --- present option --- */
  .opt-present{
    background: #f9f7f0;
    border-color: #e3dcc8;
    padding: 16px 18px;
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
  }
  .opt-present.selected{
    border-color: var(--green-soft);
    box-shadow: 0 6px 0 rgba(39,68,52,0.14);
    background: #f4f7f2;
  }
  .opt-present .txt strong{
    display:block;
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 500;
    font-size: 19px;
    margin-bottom: 2px;
    color: var(--green-deep);
  }
  .opt-present .txt span{ font-size: 12.5px; color: var(--muted); }

  .stamp{
    width: 44px; height:44px;
    border-radius: 50%;
    border: 2.5px solid var(--green-soft);
    display:flex; align-items:center; justify-content:center;
    color: var(--green-soft);
    font-size: 19px;
    font-weight: 900;
    transform: rotate(-8deg) scale(0.85);
    opacity: 0.35;
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
    flex-shrink:0;
  }
  .opt-present.selected .stamp{
    opacity: 1;
    transform: rotate(-8deg) scale(1);
    background: rgba(39,68,52,0.10);
  }

  /* --- excuse option --- */
  .opt-excuse{
    background: #fdf6f0;
    border-color: #ecd6c2;
    padding: 16px 18px;
  }
  .opt-excuse.selected{
    border-color: var(--orange);
    box-shadow: 0 6px 0 rgba(216,114,52,0.14);
  }
  .opt-excuse .head{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .clip{
    width: 18px; height: 24px;
    border: 2.5px solid var(--orange);
    border-radius: 9px 9px 0 0 / 9px 9px 0 0;
    border-bottom: none;
    opacity:.5;
    transform: rotate(8deg);
    flex-shrink:0;
  }
  .opt-excuse .head strong{
    font-family:'Reem Kufi', sans-serif;
    font-weight: 500;
    font-size: 19px;
    color: var(--orange-deep);
  }

  .excuse-body{
    max-height: 0;
    overflow:hidden;
    transition: max-height .28s ease;
  }
  .opt-excuse.selected .excuse-body{ max-height: 160px; }

  textarea{
    width:100%;
    margin-top: 12px;
    min-height: 78px;
    resize: vertical;
    font-family:'Tajawal', sans-serif;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    background: repeating-linear-gradient(180deg, #fdf6f0 0px, #fdf6f0 27px, #f3ddc9 28px);
    padding: 8px 12px;
    outline: none;
    color: var(--ink);
    box-shadow: inset 0 0 0 1.5px #ecd6c2;
  }
  textarea::placeholder{ color:#d0ab8f; }
  textarea:focus{ box-shadow: inset 0 0 0 2px var(--orange); }

  .submit{
    width:100%;
    margin-top: 26px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family:'Reem Kufi', sans-serif;
    font-weight: 600;
    font-size: 17px;
    color: #fbf7ee;
    background: linear-gradient(180deg, var(--green-soft), var(--green-deep));
    cursor:pointer;
    letter-spacing: .5px;
    transition: filter .15s ease, transform .1s ease;
  }
  .submit:hover{ filter: brightness(1.08); }
  .submit:active{ transform: translateY(1px); }
  .submit:disabled{ opacity:.4; cursor:not-allowed; filter:none; }

  .confirm{
    display:none;
    margin-top: 16px;
    text-align:center;
    font-size: 14px;
    font-weight: 700;
    padding: 10px;
    border-radius: 8px;
  }
  .confirm.show{ display:block; animation: pop .25s ease; }
  .confirm.ok{ background: rgba(39,68,52,0.10); color: var(--green-deep); }
  .confirm.warn{ background: rgba(216,114,52,0.12); color: var(--orange-deep); }

  @keyframes pop{
    from{ transform: scale(0.9); opacity:0; }
    to{ transform: scale(1); opacity:1; }
  }

  @media (max-width: 420px){
    .body{ padding: 26px 20px 24px; }
    h1{ font-size: 22px; }
    .logo{ width: 200px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>

  <div class="sadu"></div>

  <div class="body">
    <p class="eyebrow">تسجيل الحضور</p>
    <h1>اكتب اسمك، وحدّد حالتك</h1>

    <label for="studentName">الاسم</label>
    <input id="studentName" class="name-field" type="text" placeholder="مثال: الطيّب ابن الطيّب" autocomplete="off">

    <div class="divider">اختر واحدًا</div>

    <div class="options">
      <div class="option opt-present" id="optPresent" role="button" tabindex="0">
        <div class="txt">
          <strong>أول الحاضرين</strong>
          <span>حاضر ومسجّل قبل بداية الحصة</span>
        </div>
        <div class="stamp">✓</div>
      </div>

      <div class="option opt-excuse" id="optExcuse" role="button" tabindex="0">
        <div class="head">
          <div class="clip"></div>
          <strong>للأسف بسبب:</strong>
        </div>
        <div class="excuse-body">
          <textarea id="excuseText" placeholder="أفا .. وش صاير؟"></textarea>
        </div>
      </div>
    </div>

    <button class="submit" id="submitBtn" disabled>تسجيل</button>

    <div class="confirm ok" id="confirmOk">✓ تم تسجيلك ضمن أول الحاضرين</div>
    <div class="confirm warn" id="confirmWarn">تم إرسال عذرك، بالتوفيق في الحصة القادمة</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ⚠️ عبّي القيمتين التاليتين من: Supabase Dashboard > Settings > API
  const SUPABASE_URL = 'https://tzqezciotbhbtvvnpcos.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_2xJ7ideCasonn85F-i-DlQ_UT1iEHwn';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const nameField = document.getElementById('studentName');
  const optPresent = document.getElementById('optPresent');
  const optExcuse = document.getElementById('optExcuse');
  const excuseText = document.getElementById('excuseText');
  const submitBtn = document.getElementById('submitBtn');
  const confirmOk = document.getElementById('confirmOk');
  const confirmWarn = document.getElementById('confirmWarn');

  let choice = null;

  function selectPresent(){
    choice = 'present';
    optPresent.classList.add('selected');
    optExcuse.classList.remove('selected');
    validate();
  }
  function selectExcuse(){
    choice = 'excuse';
    optExcuse.classList.add('selected');
    optPresent.classList.remove('selected');
    validate();
    excuseText.focus();
  }

  optPresent.addEventListener('click', selectPresent);
  optExcuse.addEventListener('click', selectExcuse);
  optPresent.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') selectPresent(); });
  optExcuse.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') selectExcuse(); });
  excuseText.addEventListener('click', e => e.stopPropagation());

  function validate(){
    const hasName = nameField.value.trim().length > 0;
    const hasChoice = choice === 'present' || (choice === 'excuse' && excuseText.value.trim().length > 0);
    submitBtn.disabled = !(hasName && hasChoice);
  }

  nameField.addEventListener('input', validate);
  excuseText.addEventListener('input', validate);

  submitBtn.addEventListener('click', async () => {
    confirmOk.classList.remove('show');
    confirmWarn.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'جاري التسجيل...';

    const { error } = await sb.from('attendance').insert({
      student_name: nameField.value.trim(),
      status: choice,
      excuse_reason: choice === 'excuse' ? excuseText.value.trim() : null
    });

    submitBtn.textContent = 'تسجيل';

    if (error) {
      alert('حدث خطأ أثناء التسجيل، حاول مرة أخرى.');
      console.error(error);
      submitBtn.disabled = false;
      return;
    }

    if(choice === 'present'){
      confirmOk.classList.add('show');
    } else {
      confirmWarn.classList.add('show');
    }

    nameField.value = '';
    excuseText.value = '';
    optPresent.classList.remove('selected');
    optExcuse.classList.remove('selected');
    choice = null;
    submitBtn.disabled = true;
  });
</script>

</body>
