<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>طوبي — التسجيل مغلق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:   #1f3a2c;
    --green:        #274434;
    --green-soft:   #3d6b52;
    --orange:       #d87234;
    --orange-deep:  #b95a24;
    --stone:        #928a7e;
    --stone-light:  #bcb5ae;
    --cream:        #f8f6f1;
    --paper:        #fffdf8;
    --paper-line:   #ece5d6;
    --ink:          #26221c;
    --muted:        #8a8172;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    min-height: 100dvh;
    background:
      radial-gradient(circle at 15% 0%, rgba(216,114,52,0.08), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(39,68,52,0.10), transparent 45%),
      var(--cream);
    font-family: 'Tajawal', sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }

  .card{
    background: var(--paper);
    width: 100%;
    max-width: 460px;
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(31,58,44,0.16), 0 1px 0 rgba(255,255,255,0.6) inset;
    overflow: hidden;
    position: relative;
  }

  /* ---------- header ---------- */
  .header{
    position: relative;
    padding: clamp(24px, 6vw, 34px) clamp(16px, 5vw, 24px) 0;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(180deg, #fbf8f2, var(--paper) 85%);
  }

  .peaks{
    position:absolute;
    left:0; right:0; top: 8px;
    width:100%;
    height: 92px;
    opacity: 0.55;
  }

  .logo{
    position: relative;
    width: clamp(160px, 55vw, 280px);
    max-width: 90%;
    height: auto;
    margin: 8px auto clamp(12px, 4vw, 20px);
    display:block;
  }

  /* sadu triangle band */
  .sadu{
    height: 16px;
    width: 100%;
    background-image: url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='64' height='16'%3E%3Cpolygon points='0,16 8,0 16,16' fill='%23274434'/%3E%3Cpolygon points='16,16 24,0 32,16' fill='%23d87234'/%3E%3Cpolygon points='32,16 40,0 48,16' fill='%23928a7e'/%3E%3Cpolygon points='48,16 56,0 64,16' fill='%23274434'/%3E%3C/svg%3E");
    background-repeat: repeat-x;
    background-size: 64px 16px;
  }

  /* ---------- body ---------- */
  .body{
    padding: clamp(28px, 8vw, 44px) clamp(18px, 6vw, 30px) clamp(30px, 8vw, 46px);
    text-align: center;
  }

  .lock-badge{
    width: 60px;
    height: 60px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(39,68,52,0.08);
    border: 2px solid var(--green-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--green-soft);
    font-size: 24px;
  }

  .eyebrow{
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--muted);
    font-weight: 700;
    margin: 0 0 10px;
  }

  h1{
    font-family: 'Reem Kufi', sans-serif;
    font-weight: 600;
    font-size: clamp(22px, 6vw, 30px);
    margin: 0 0 14px;
    color: var(--green-deep);
    line-height: 1.4;
  }

  p.msg{
    font-size: clamp(14px, 4vw, 16px);
    color: var(--muted);
    line-height: 1.9;
    margin: 0 auto;
    max-width: 320px;
  }

  .divider{
    display:flex;
    align-items:center;
    gap: 12px;
    margin: 28px 0 24px;
    color: var(--stone-light);
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--paper-line);
  }
  .divider span{
    font-size: 13px;
    color: var(--orange-deep);
    font-weight: 700;
    letter-spacing: 1px;
  }

  @media (max-width: 340px){
    .lock-badge{ width: 52px; height: 52px; font-size: 20px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
